bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    speed_limit_topic: "/speed_limit"
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    # plugin: "nav2_controller::SimpleGoalChecker"
    # xy_goal_tolerance: 0.25
    # yaw_goal_tolerance: 0.25
    # stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.28
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.28
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 2.5 #1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 1.0
      PathAlign.scale: 28.0 #18.0
      PathAlign.forward_point_distance: 0.2 #0.1
      GoalAlign.scale: 24.0 #14.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 28.0 #18.0
      GoalDist.scale: 24.0 #14.0
      RotateToGoal.scale: 12.0 #18.0 #32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      footprint: "[[0.43, 0.33], [0.43, -0.33], [-0.43, -0.33], [-0.43, 0.33]]" 
      plugins: ["voxel_layer", "inflation_layer"]
      filters: ["speed_filter"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: -0.3 #0.0
        z_resolution: 0.05
        z_voxels: 32 #16
        max_obstacle_height: 2.0
        mark_threshold: 1
        observation_sources: pointcloud
        pointcloud:
          topic: /voxel_cluster
          max_obstacle_height: 2.0
          min_obstacle_height: 0.08
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: True
        filter_info_topic: "/speed_costmap_filter_info"
        speed_limit_topic: "/speed_limit"
      always_send_full_costmap: True
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[0.43, 0.33], [0.43, -0.33], [-0.43, -0.33], [-0.43, 0.33]]" 
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /merged_laser
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: -0.3 #-0.1
        z_resolution: 0.05
        z_voxels: 32 #16
        max_obstacle_height: 2.0
        min_obstacle_height: 0.07
        mark_threshold: 1
        observation_sources: pointcloud
        pointcloud:
          topic: /voxel_cluster
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.08
          max_obstacle_height: 2.0
          obstacle_min_range: 0.05
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 3.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/keepout_costmap_filter_info"
      always_send_full_costmap: True
map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""
map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5 #1.0
    min_rotational_vel: 0.2 #0.4
    rotational_acc_lim: 1.5 #3.2
robot_state_publisher:
  ros__parameters:
    use_sim_time: True
waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: True
    type: 0
    filter_info_topic: "/keepout_costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: True
    frame_id: "map"
    topic_name: "/keepout_filter_mask"
    yaml_filename: "/home/jd/ui_ws/src/delivery_ui/maps/C4I4_keepout_mask.yaml"

speed_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: True
    type: 1
    filter_info_topic: "/speed_costmap_filter_info"
    mask_topic: "/speed_filter_mask"
    base: 0.0
    multiplier: 1.0

speed_filter_mask_server:
  ros__parameters:
    use_sim_time: True
    frame_id: "map"
    topic_name: "/speed_filter_mask"
    yaml_filename: "/home/jd/ui_ws/src/delivery_ui/maps/C4I4_speed_mask.yaml"
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 40.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.23, 0.0, 1.0]
    min_velocity: [-0.23, 0.0, -1.0]
    max_accel: [0.5, 0.0, 0.5]
    max_decel: [-0.5, 0.0, -0.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

docking_server:
  ros__parameters:
    controller_frequency: 10.0
    initial_perception_timeout: 10.0  # Increased: time to wait at staging pose for AprilTag detection
    wait_charge_timeout: 5.0
    dock_approach_timeout: 60.0
    undock_linear_tolerance: 0.05 
    undock_angular_tolerance: 0.05
    
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5  # Tolerance to reach staging pose
    dock_database: $(find-pkg-share apriltag_ros)/cfg/dock_database.yaml

 
    ## Types of docks
    dock_plugins: ['cyborg_dock']
    cyborg_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05    # Stop much before tag (~35 cm from docking pose)
      staging_x_offset: -1.5     # Distance in front of dock to stage (must be visible to camera - increased for better detection)
      staging_yaw_offset: 0.0    # Orientation at staging pose (robot faces the charging dock)
      dock_direction: "forward"
      use_external_detection_pose: true  # Enable AprilTag refinement at staging pose
      use_battery_status: false
      use_stall_detection: false
      stall_velocity_threshold: 1.0
      stall_effort_threshold: 1.0
      charging_threshold: 0.5
 
      external_detection_timeout: 10.0  # Time to detect tag after reaching staging pose
      external_detection_translation_x: -0.52   # Use tag pose directly
      external_detection_translation_y: 0.0   # No lateral offset
      external_detection_rotation_roll: -1.5708  # Guide-aligned axis mapping for camera optical frame
      external_detection_rotation_pitch: 1.5708
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.05  # Smoothing filter for detected poses (slower convergence for stability)
  
    controller:
      k_phi: 1.0
      k_delta: 2.5
      beta: 0.6
      lambda: 2.2
      v_linear_min: 0.03
      v_linear_max: 0.08
      v_angular_max: 0.08
      slowdown_radius: 0.6
      use_collision_detection: true
      costmap_topic: "/local_costmap/costmap_raw"
      footprint_topic: "/local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.2
